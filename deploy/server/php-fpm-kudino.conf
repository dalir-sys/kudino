; Kudino — /etc/php/__PHP_VERSION__/fpm/pool.d/__APP__.conf
; Separate pool so Kudino and Shock Support cannot starve each other.
; Placeholders: __APP__ __APP_ROOT__ __POOL_USER__ __PHP_VERSION__ __POOL_MAX_CHILDREN__

[__APP__]
user = __POOL_USER__
group = __POOL_USER__

listen = /run/php/php__PHP_VERSION__-fpm-__APP__.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = __POOL_MAX_CHILDREN__
pm.process_idle_timeout = 20s
pm.max_requests = 300
request_terminate_timeout = 120s

; Per-pool limits (php.ini is not touched)
php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 16M
php_admin_value[post_max_size] = 16M
php_admin_value[max_execution_time] = 120
php_admin_value[open_basedir] = __APP_ROOT__/:/tmp/:/usr/share/php/
php_admin_flag[expose_php] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/php__PHP_VERSION__-fpm-__APP__.log

; A private sessions/tmp area inside the app root keeps open_basedir tight
php_admin_value[session.save_path] = __APP_ROOT__/shared/tmp
php_admin_value[upload_tmp_dir] = __APP_ROOT__/shared/tmp
env[TMPDIR] = __APP_ROOT__/shared/tmp
