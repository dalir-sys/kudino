# Kudino — /etc/nginx/sites-available/kudino
# Installed by deploy/bootstrap.sh. Certbot later adds the HTTPS server block to THIS file only.
# Placeholders: __SERVER_NAMES__ __APP_ROOT__ __APP__ __PHP_VERSION__

server {
	listen 80;
	listen [::]:80;
	server_name __SERVER_NAMES__;

	root __APP_ROOT__/current;
	index index.php;

	access_log /var/log/nginx/__APP__.access.log;
	error_log  /var/log/nginx/__APP__.error.log warn;

	client_max_body_size 16m;
	server_tokens off;

	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header X-Frame-Options "SAMEORIGIN" always;

	location = /favicon.ico { log_not_found off; access_log off; try_files $uri =204; }
	location = /robots.txt  { log_not_found off; access_log off; try_files $uri /index.php?$args; }

	# Let's Encrypt HTTP-01 challenges
	location ^~ /.well-known/acme-challenge/ { default_type "text/plain"; try_files $uri =404; }

	# Hidden files, config backups, and PHP inside uploads are never served or executed
	location ~ /\.(?!well-known) { deny all; }
	location ~* \.(?:bak|backup|sql|log|ini|sh|dist)$ { deny all; }
	location ~* ^/wp-content/uploads/.*\.(?:php|phtml|phar)$ { deny all; }
	location = /xmlrpc.php { deny all; access_log off; }
	location = /wp-config.php { deny all; }

	location / {
		try_files $uri $uri/ /index.php?$args;
	}

	# Static assets: long cache (theme files carry ?ver= so updates still bust it)
	location ~* \.(?:css|js|mjs|woff2?|ttf|svg|png|jpe?g|gif|webp|avif|ico)$ {
		expires 30d;
		access_log off;
		try_files $uri /index.php?$args;
	}

	location ~ \.php$ {
		include snippets/fastcgi-php.conf;
		# $realpath_root resolves the "current" symlink, so OPcache sees each release as new code.
		fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
		fastcgi_param DOCUMENT_ROOT   $realpath_root;
		fastcgi_pass unix:/run/php/php__PHP_VERSION__-fpm-__APP__.sock;
		fastcgi_read_timeout 120s;
		fastcgi_buffers 16 16k;
		fastcgi_buffer_size 32k;
	}
}
