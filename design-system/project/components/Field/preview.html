<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><title>Field</title>
<style>html,body{margin:0;background:var(--kd-paper);color:var(--kd-ink);font-family:var(--kd-ui)} .pv{padding:24px;display:flex;flex-wrap:wrap;gap:16px;align-items:center}.pv{align-items:start}</style></head>
<body>
<div class="pv" dir="rtl">
<div class="kd-field" style="width:300px"><label class="kd-field__label" for="a">شماره موبایل</label><span class="kd-control"><input id="a" type="tel" placeholder="۰۹۱۲ ۰۰۰ ۰۰۰۰"></span><span class="kd-field__hint">برای تماس کارشناس</span></div><div class="kd-field" style="width:300px"><label class="kd-field__label" for="b">ایمیل</label><span class="kd-control is-error"><input id="b" value="hello@kudino"></span><span class="kd-field__hint is-error">ایمیل کامل نیست؛ مثل name@mail.com بنویسید.</span></div><div class="kd-field" style="width:300px"><label class="kd-field__label" for="c">سطح زیر کشت</label><span class="kd-control kd-control--ruled"><input id="c" placeholder="۲"><span class="kd-control__suffix">هکتار</span></span></div><form class="kd-search" style="width:300px" role="search" method="get" action="http://localhost:8080/">

					<svg class="kd-icon " width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>					<span class="kd-sr">جستجو</span>
					<input type="search" name="s" id="kd-search-input" value="" placeholder="نام کود یا عنصر…">
					<kbd aria-hidden="true">/</kbd>
									</label>
			</form>
</div>

</html>
