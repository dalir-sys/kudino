<!-- @dsCard height=300 -->
<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><title>Cover</title>
<style>
	html, body { margin: 0; background: var(--kd-paper); }
	.cv { position: relative; width: 960px; height: 300px; overflow: hidden; background: var(--kd-paper); }
	.cv svg { position: absolute; inset: 0; }
	.tint { fill: var(--kd-paper-3); }
	.field { fill: var(--kd-field); }
	.ink { fill: var(--kd-ink); }
	.n { fill: var(--kd-n); } .p { fill: var(--kd-p); } .k { fill: var(--kd-k); }
	.rule { stroke: var(--kd-rule); stroke-width: 1; }
	.sq { rx: var(--kd-r-1); }
	.txt { position: absolute; left: 40px; bottom: 34px; width: 420px; text-align: right; direction: rtl; }
	.name { margin: 0; font-family: var(--font-display, "Markazi Text"), serif; font-weight: 600; font-size: 120px; line-height: .95; color: var(--kd-ink); }
	.tag { margin: 12px 0 0; font-family: var(--font-ui, "IBM Plex Sans Arabic"), sans-serif; font-size: 14px; color: var(--kd-ink-3); }
</style></head>
<body>
<div class="cv">
	<!--
		blocks:  kd-field slab 216×300 (bleeds top/bottom/right) · kd-ink 108×88 · kd-paper-3 200×72 · N/P/K bars 48 wide at 228/144/184 tall
		arrangement: one tall slab with satellites; the three bars stand on the bottom edge like an analysis chart
		pattern: "editorial, borders not shadows" → three kd-rule hairlines at a 60px pitch crossing behind the bars (a chart grid)
		steps & radii: gaps kd-s-4 (16), bar width kd-s-12 (48), inset kd-s-6 (24); corners kd-r-1 (2px) — the system is square
	-->
	<svg width="960" height="300" viewBox="0 0 960 300" aria-hidden="true">
		<line class="rule" x1="480" y1="120" x2="744" y2="120"/>
		<line class="rule" x1="480" y1="180" x2="744" y2="180"/>
		<line class="rule" x1="480" y1="240" x2="744" y2="240"/>
		<rect class="tint sq" x="480" y="0" width="200" height="72"/>
		<rect class="n" x="504" y="72" width="48" height="228"/>
		<rect class="p" x="568" y="156" width="48" height="144"/>
		<rect class="k" x="632" y="116" width="48" height="184"/>
		<rect class="field" x="744" y="0" width="216" height="300"/>
		<rect class="ink" x="744" y="212" width="108" height="88"/>
	</svg>
	<div class="txt">
		<h1 class="name">کودینو</h1>
		<p class="tag">دفترچه‌ی طراحی Field Almanac: کاغذ، جوهر، و رنگ‌هایی که فقط داده‌اند.</p>
	</div>
</div>
</body>
</html>
